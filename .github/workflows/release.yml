name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_version.outputs.version }}
      tag_exists: ${{ steps.check_version.outputs.tag_exists }}
      version_ok: ${{ steps.check_version.outputs.version_ok }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check version
        id: check_version
        run: .github/scripts/check-version.sh

      - name: Fail if version is not newer than the latest release
        if: steps.check_version.outputs.tag_exists == 'false' && steps.check_version.outputs.version_ok == 'false'
        run: |
          echo "::error::バージョン(v${{ steps.check_version.outputs.version }})は既存の最新リリースより新しくする必要があります。composeApp/build.gradle.ktsのpackageVersionを確認してください。"
          exit 1

  build-macos:
    name: Build macOS installer
    needs: determine-version
    if: needs.determine-version.outputs.tag_exists == 'false' && needs.determine-version.outputs.version_ok == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dmg
        run: ./gradlew packageDmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  build-windows:
    name: Build Windows installer
    needs: determine-version
    if: needs.determine-version.outputs.tag_exists == 'false' && needs.determine-version.outputs.version_ok == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build msi
        run: ./gradlew.bat packageMsi

      - name: Upload msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi

  release:
    name: Create tag and release
    needs: [determine-version, build-macos, build-windows]
    if: needs.determine-version.outputs.tag_exists == 'false' && needs.determine-version.outputs.version_ok == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msi
          path: artifacts

      - name: Create and push tag
        run: |
          TAG="v${{ needs.determine-version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.determine-version.outputs.version }}"
          generate_release_notes: true
          files: artifacts/**
